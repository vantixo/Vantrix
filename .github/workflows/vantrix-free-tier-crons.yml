# AUTO-GENERATED by scripts/generate-vercel-json.mjs — do not hand-edit.
#
# Drives the cron jobs that fire more than once/day, which Vercel Hobby
# can't schedule natively. Each job below hits its Vantrix route on its
# real cadence, authenticating exactly like Vercel Cron does.
#
# Setup — add two repo secrets (Settings → Secrets and variables → Actions):
#   VANTRIX_BASE_URL   e.g. https://your-app.vercel.app
#   CRON_SECRET        same value as the CRON_SECRET env var on Vercel
#
# When you upgrade to Vercel Pro: set CRON_TIER=pro and redeploy — the
# same jobs move into vercel.json at full precision. You can then delete
# this workflow file (or just leave it disabled; nothing depends on it).
#
# Caveat: GitHub Actions schedules are best-effort (can run several minutes
# late under load) and are auto-disabled after 60 days with no repo
# activity. For the money-moving jobs (billing-recovery) consider a
# dedicated pinger (e.g. cron-job.org, free) instead if exact timing matters.
name: Vantrix free-tier crons
on:
  workflow_dispatch: {}
  schedule:
    - cron: '*/5 * * * *' # queue-worker, billing-recovery, message-recovery
    - cron: '0 * * * *' # training-data-export, economy-tick, registration-reminders, revocation-sweep
    - cron: '0 */6 * * *' # nudges, legacy-tick, paystack-renewal, animate-backfill
    - cron: '0 */2 * * *' # character-initiatives, narrative-tick
    - cron: '0 */3 * * *' # character-posts, civic-affairs-tick
    - cron: '20 */3 * * *' # character-social
    - cron: '0 */4 * * *' # governance-tick
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Determine which job(s) are due this run
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BASE_URL: ${{ secrets.VANTRIX_BASE_URL }}
        run: |
          set -e
          SCHEDULE="${{ github.event.schedule }}"
          # schedule::path pairs, one per job. Several jobs legitimately share
          # a cadence (e.g. four jobs all run "0 * * * *"), so this is a list to
          # loop and filter, not a schedule -> single-path map.
          PAIRS=(
            "*/5 * * * *::/api/queue/worker"
            "0 * * * *::/api/cron/training-data-export"
            "0 */6 * * *::/api/cron/nudges"
            "0 */2 * * *::/api/cron/character-initiatives"
            "0 */3 * * *::/api/cron/character-posts"
            "20 */3 * * *::/api/cron/character-social"
            "*/5 * * * *::/api/cron/billing-recovery"
            "0 * * * *::/api/cron/economy-tick"
            "0 */4 * * *::/api/cron/governance-tick"
            "0 */3 * * *::/api/cron/civic-affairs-tick"
            "0 */2 * * *::/api/cron/narrative-tick"
            "0 */6 * * *::/api/cron/legacy-tick"
            "0 */6 * * *::/api/cron/paystack-renewal"
            "0 */6 * * *::/api/cron/animate-backfill"
            "0 * * * *::/api/cron/registration-reminders"
            "*/5 * * * *::/api/cron/message-recovery"
            "0 * * * *::/api/cron/revocation-sweep"
          )
          FAILED=()
          fire() {
            local path="$1"
            echo "-> $path"
            if curl -fsS -X GET "$BASE_URL$path" -H "Authorization: Bearer $CRON_SECRET"; then
              echo "   ok $path"
            else
              echo "   ! $path failed"
              FAILED+=("$path")
            fi
          }
          if [ -z "$SCHEDULE" ]; then
            echo "Manual run (workflow_dispatch) — hitting every job once."
            for pair in "${PAIRS[@]}"; do fire "${pair#*::}"; done
          else
            echo "Schedule $SCHEDULE fired — running all jobs on that cadence:"
            for pair in "${PAIRS[@]}"; do
              if [ "${pair%%::*}" = "$SCHEDULE" ]; then fire "${pair#*::}"; fi
            done
          fi
          # Every matching route is fired above regardless of earlier failures
          # (a stuck economy-tick shouldn't suppress billing-recovery). Failure
          # is only surfaced now, once the whole batch has run — this is what
          # actually failed silently before: `|| echo` always exited 0, so a
          # dead route showed green here forever. Non-zero exit -> failed GH
          # Actions run -> default email/UI notification to repo watchers.
          if [ ${#FAILED[@]} -gt 0 ]; then
            echo "::error::${#FAILED[@]} cron route(s) failed: ${FAILED[*]}"
            exit 1
          fi
